version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: stg
    schedule:
      interval: weekly
    # 公開直後の版を避ける
    cooldown:
      default-days: 7
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']
      dependencies:
        patterns: ['*']
    ignore:
      # v-for内のスロット変数を誤検出
      - dependency-name: vue-tsc
        versions: ['3.3.12', '3.3.13']

  - package-ecosystem: github-actions
    directory: /
    target-branch: stg
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
