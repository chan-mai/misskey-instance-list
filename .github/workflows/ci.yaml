name: Misskey Instance List CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # versionを指定せずルートpackage.jsonのpackageManagerに従わせる
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # typecheckは@mil/coreのdistを参照するため先にビルドする
      - name: Build
        run: pnpm -r build

      # schema.tsを触ってマイグレーション未生成のままのPRを落とす
      - name: Check drizzle migrations are up to date
        run: |
          pnpm --filter @mil/core db:generate
          git diff --exit-code packages/core/drizzle

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm -r typecheck
