name: Misskey Instance List CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # versionを指定せずルートpackage.jsonのpackageManagerに従わせる
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # typecheckは@mil/coreのdistを参照するため先にビルドする
      # coreのbuildがprisma generateも兼ねる
      - name: Build
        run: pnpm -r build
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/mydb"

      - name: Check generated Prisma client is up to date
        run: git diff --exit-code packages/core/src/generated

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm -r typecheck
