packages:
  - 'packages/*'

# drizzle-ormは全パッケージで同一インスタンスでないと演算子シンボルが一致しない
catalog:
  drizzle-orm: ^0.45.2

overrides:
  '@esbuild-kit/core-utils>esbuild': '^0.25.12'
  valibot: '^1.4.2'
  '@hono/node-server': '^2.0.5'
  devalue@<5.9.3: '^5.9.3'
  mysql2@<3.23.1: '^3.23.1'
  serialize-javascript@<7.1.2: '^7.1.2'
  deepmerge-ts@<8.0.0: '^8.0.2'
  undici@>=7.0.0 <7.29.1: '^7.29.1'

onlyBuiltDependencies:
  - '@parcel/watcher'
  - workerd
  - '@prisma/engines'
  - esbuild
  - prisma
  - protobufjs
