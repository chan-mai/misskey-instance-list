packages:
  - 'packages/*'

# drizzle-ormは全パッケージで同一インスタンスでないと演算子シンボルが一致しない
catalog:
  drizzle-orm: ^0.45.2

overrides:
  '@esbuild-kit/core-utils>esbuild': '^0.25.12'
  valibot: '^1.4.2'
  '@hono/node-server': '^2.0.5'

onlyBuiltDependencies:
  - '@parcel/watcher'
  - workerd
  - '@prisma/engines'
  - esbuild
  - prisma
  - protobufjs
